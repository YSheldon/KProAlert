name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r plugins/kpro-alerts/requirements.txt
      - run: python tools/validate_package.py
      - run: python -m unittest discover -s plugins/kpro-alerts/scripts -p 'test_*.py'
      - run: python plugins/kpro-alerts/scripts/test_mcp_stdio.py
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./plugins/kpro-alerts/scripts/test_lifecycle_native.ps1
